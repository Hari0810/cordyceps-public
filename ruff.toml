[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long — handled by formatter
  "B006",  # mutable default arg — too many existing instances
  "B007",  # unused loop variable — existing code
  "SIM105", # try/except/pass — existing patterns
  "SIM108", # ternary — existing patterns
  "UP007", # X | Y union syntax — py310+ only guarantee
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
